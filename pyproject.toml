[project]
name = "quarry"
version = "0.1.0"
description = "Ask your database anything: a LangGraph agent that plans, writes, verifies and self-corrects SQL, and shows its work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aamod Bhatt" }]
requires-python = ">=3.12,<3.13"
keywords = ["text-to-sql", "langgraph", "agents", "llm", "mcp", "sqlglot", "guardrails"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "sqlglot>=30.27,<31",
  "duckdb>=2.0",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "typer>=0.15",
  "rich>=13.9",
  "mcp>=2.3,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.0"]

[project.scripts]
quarry = "quarry.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
]
docs = ["playwright>=1.49", "pillow>=11"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET", "TID", "PL", "S"]
# PLR0913/PLR0917: Typer commands declare every CLI option as a parameter.
# S608: quarry builds SQL strings on purpose; every one goes through the guard or quotes identifiers.
ignore = [
  "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415",
  "RUF001", "RUF002", "RUF003", "S608", "S311", "SIM905", "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["playwright.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "network: needs network access (never part of the default suite)",
]
