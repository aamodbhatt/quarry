name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --group docs
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type-check (mypy --strict)
        run: uv run mypy src tests scripts
      - name: Tests (no network, no API key, scripted model)
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: quarry:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the CLI in the image
        run: docker run --rm --entrypoint quarry quarry:ci --help
