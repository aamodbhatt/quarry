# docker compose up --build   ->  http://127.0.0.1:8097
services:
  quarry:
    build: .
    image: quarry:local
    ports:
      - "127.0.0.1:8097:8097"
    env_file:
      - path: .env
        required: false
    # Without OPENROUTER_API_KEY, use the scripted demo:  command: ["serve", "--host", "0.0.0.0", "--offline"]
    command: ["serve", "--host", "0.0.0.0"]
    volumes:
      - quarry-data:/app/data
      - quarry-runs:/app/runs
    restart: unless-stopped

volumes:
  quarry-data:
  quarry-runs:
